# All-in-one stack: SQL Server + advisor + live WS runner.
#
# Quick start (Oracle Cloud / any Linux VM):
#   cp .env.docker.example .env.docker   # edit passwords + Zerodha keys
#   ./deploy/setup.sh                    # sets COMPOSE_PROFILES=bundled
#
# Windows laptop with local SQLEXPRESS (no bundled SQL):
#   Set OPT_DB_SERVER=host.docker.internal\SQLEXPRESS in .env.docker
#   docker compose up -d options_advisor ws_runner

services:
  # ---------------------------------------------------------------------------
  # SQL Server Express — bundled DB (10 GB limit, free).
  # On Oracle Cloud ARM VMs the image runs under amd64 emulation
  # (platform: linux/amd64 below). Allow ~60s for first startup.
  # ---------------------------------------------------------------------------
  sqlserver:
    profiles: [bundled]
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: options_sqlserver
    platform: linux/amd64
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env.docker}
    volumes:
      - sqlserver_data:/var/opt/mssql
    # Do NOT publish 1433 to the internet — app reaches DB on the internal network.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -C -b || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  options_advisor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock_options_advisor
    image: stock_options_advisor:latest
    restart: unless-stopped
    environment:
      - TZ=Asia/Kolkata
    env_file:
      - .env.docker
    ports:
      - "${OPT_DASHBOARD_PORT:-5001}:5001"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./archive:/app/archive
      - ./dashboard:/app/dashboard
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sqlserver:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # WebSocket runner — Zerodha live ticks (optional but recommended).
  #
  # Skip if you only want EOD:  docker compose up -d sqlserver options_advisor
  #
  # Requires a valid data/zerodha_session.json (run --zerodha-login each morning).
  # ---------------------------------------------------------------------------
  ws_runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock_ws_runner
    image: stock_options_advisor:latest
    command: ["python", "main.py", "--ws-runner"]
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      - TZ=Asia/Kolkata
    env_file:
      - .env.docker
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      options_advisor:
        condition: service_started
      sqlserver:
        condition: service_healthy
        required: false

volumes:
  sqlserver_data:
